openapi: 3.0.3
info:
  title: CareNexus Prototype API
  version: 1.1.0
  description: API starter for the CareNexus web and FlutterFlow companion app. Demo authentication only; do not use real patient data.
servers:
  - url: https://YOUR-CARENEXUS-RENDER-URL.onrender.com
    description: Replace with your deployed service URL
paths:
  /api/login:
    post:
      summary: Demo login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, role]
              properties:
                phone: { type: string }
                password: { type: string }
                role: { type: string, enum: [patient, asha, facility, admin] }
      responses:
        '200': { description: Login result }
        '401': { description: Invalid demo credentials }
  /api/facilities:
    get:
      summary: List connected CareNexus facilities
      responses:
        '200': { description: Facility list }
  /api/live-search:
    get:
      summary: Search public OpenStreetMap health listings (not verified)
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: location
          required: true
          schema: { type: string }
      responses:
        '200': { description: Public map search results }
  /api/appointments:
    get:
      summary: List appointments
      parameters:
        - in: query
          name: patient_id
          schema: { type: integer }
        - in: query
          name: facility_id
          schema: { type: integer }
      responses:
        '200': { description: Appointment list }
  /api/sos:
    post:
      summary: Create a CareNexus SOS coordination request
      description: Prototype only; does not dispatch ambulance. Recipients must be separately verified and active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, emergency_type]
              properties:
                patient_id: { type: integer }
                latitude: { type: number }
                longitude: { type: number }
                location_text: { type: string }
                emergency_type: { type: string }
                description: { type: string }
      responses:
        '201': { description: SOS request created }
    get:
      summary: Get patient SOS history or facility incoming requests
      parameters:
        - in: query
          name: patient_id
          schema: { type: integer }
        - in: query
          name: facility_id
          schema: { type: integer }
      responses:
        '200': { description: SOS request list }
  /api/sos/{id}/accept:
    post:
      summary: Accept an eligible SOS request (first acceptance wins)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility_id]
              properties:
                facility_id: { type: integer }
      responses:
        '200': { description: Accepted }
        '409': { description: Already accepted or no longer available }
  /api/sos/{id}/confirmation:
    patch:
      summary: Patient confirms, denies or cannot verify SOS
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, confirmation]
              properties:
                patient_id: { type: integer }
                confirmation: { type: string, enum: [confirmed, denied, unable] }
      responses:
        '200': { description: Confirmation recorded }
  /api/voice/signed-url:
    get:
      summary: Create temporary ElevenLabs signed voice session URL
      responses:
        '200': { description: Signed URL returned }
        '503': { description: Integration not configured }
